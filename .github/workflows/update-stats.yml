name: Update profile stats

on:
  schedule:
    - cron: '23 1 * * *' # 09:23 in Beijing
  workflow_dispatch:

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update-stats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate public stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-stats.py

      - name: Commit changed cards
        run: |
          git add -- assets/stats-light.svg assets/stats-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update profile stats'
          git push
